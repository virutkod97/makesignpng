name: Build Windows EXE

on:
  push:
    branches: [ "main", "claude/signature-image-png-app-ddmomz" ]
    tags: [ "v*" ]
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Tag phát hành (vd v1.0.0). Để trống = chỉ build, không tạo release."
        required: false
        default: ""

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      # Native libs nạp trong bộ nhớ (KHÔNG giải nén ra %TEMP%) để tránh
      # bị antivirus / chính sách máy chặn âm thầm khiến app không mở lên.
      - name: Publish x64 EXE
        run: >
          dotnet publish src/MakeSignPng/MakeSignPng.csproj
          -c Release -r win-x64 --self-contained true
          -p:PublishSingleFile=true
          -p:EnableCompressionInSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=false
          -o publish

      # Xác định tag phát hành: từ tag vX.Y.Z được đẩy, hoặc từ tham số workflow_dispatch.
      - name: Resolve release tag
        id: rel
        if: startsWith(github.ref, 'refs/tags/v') || github.event.inputs.release_tag != ''
        shell: bash
        run: |
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            echo "tag=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${{ github.event.inputs.release_tag }}" >> "$GITHUB_OUTPUT"
          fi

      # Release chính thức có version (không phải prerelease). Action tự tạo tag nếu chưa có.
      - name: Publish versioned release
        if: steps.rel.outputs.tag != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.rel.outputs.tag }}
          name: MakeSignPng ${{ steps.rel.outputs.tag }}
          body: |
            MakeSignPng ${{ steps.rel.outputs.tag }} — ứng dụng tạo ảnh chữ ký PNG trong suốt.

            Bản chạy sẵn (self-contained, không cần cài .NET) cho Windows x64:
            tải `MakeSignPng.exe` bên dưới và chạy trực tiếp.

            Nếu mở không lên, xem nhật ký tại `%TEMP%\MakeSignPng_startup.log`.
          prerelease: false
          files: publish/MakeSignPng.exe

      # Bản build lăn "latest" cho nhánh phát triển
      - name: Publish/refresh "latest" prerelease with the EXE
        if: github.ref == 'refs/heads/claude/signature-image-png-app-ddmomz'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: MakeSignPng (bản build mới nhất)
          body: |
            Bản build tự động của MakeSignPng (self-contained, không cần cài .NET).
            Tải `MakeSignPng.exe` bên dưới và chạy trực tiếp trên Windows x64.

            Nếu mở không lên, xem nhật ký tại `%TEMP%\MakeSignPng_startup.log`.
          prerelease: true
          files: publish/MakeSignPng.exe
